<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oroboros Design</title>
    <meta name="description" content="Eine Wüstenotter zieht durch die Düne, rollt sich ein und wird zum Ouroboros. Eine Seite, eine Bewegung." />
    <meta name="theme-color" content="#0E0A06" />
    <!--
      Das Werk ist ein Template, kein Auftritt. Solange nichts darauf steht,
      hat es in keinem Index etwas verloren. Die Zeile wird in Phase 1 bewusst
      entfernt — für /werkstatt bleibt sie dauerhaft (siehe src/main.tsx).
    -->
    <!-- Kein Zeichen in Phase 0, aber auch kein 404 im Protokoll: eine leere
         Daten-Adresse beendet die Suche des Browsers, ohne etwas zu laden. -->
    <link rel="icon" href="data:," />
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <div id="wurzel"></div>
    <noscript>
      <p style="font:16px/1.5 system-ui,sans-serif;padding:2rem;color:#F4EDE2;background:#0E0A06">
        Diese Seite ist eine einzige scroll-gebundene Bewegung und braucht dafür
        JavaScript. Ohne bleibt nur diese Zeile — das ist ehrlicher als ein
        halbes Bild.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
